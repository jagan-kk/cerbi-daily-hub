<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shapeRendering="crispEdges">
  <rect width="32" height="32" fill="#1a1a2e"/>
  <!-- Monitor frame -->
  <rect x="2" y="4" width="28" height="20" fill="#2d2d44" rx="2"/>
  <rect x="4" y="6" width="24" height="16" fill="#0d0d1a"/>
  <!-- Stand -->
  <rect x="12" y="24" width="8" height="2" fill="#2d2d44"/>
  <rect x="10" y="26" width="12" height="1" fill="#1a1a2e"/>
  <rect x="14" y="27" width="4" height="4" fill="#2d2d44"/>
  <!-- C letter in pixel art -->
  <rect x="8" y="9" width="14" height="2" fill="#f6d34a"/>
  <rect x="8" y="9" width="2" height="10" fill="#f6d34a"/>
  <rect x="8" y="17" width="14" height="2" fill="#f6d34a"/>
  <rect x="20" y="9" width="2" height="3" fill="#f6d34a"/>
  <rect x="20" y="16" width="2" height="3" fill="#f6d34a"/>
  <!-- Glow accent -->
  <rect x="10" y="11" width="2" height="1" fill="#ff6ec7" opacity="0.6"/>
  <rect x="18" y="16" width="2" height="1" fill="#ff6ec7" opacity="0.6"/>
  <!-- Power LED -->
  <circle cx="27" cy="27" r="1" fill="#f6d34a"/>
</svg>
